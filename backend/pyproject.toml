# Tool configuration only -- the backend isn't packaged; dependencies
# live in requirements.txt / requirements-dev.txt.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "UP",       # pyupgrade (modern syntax for py312)
  "B",        # bugbear (likely bugs)
  "SIM",      # simplifications
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom (`db: Session = Depends(get_db)`)
# is exactly what B008 flags; it's correct here.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/alembic/ is the migrations dir; the `alembic` package is third-party.
known-third-party = ["alembic"]
