[alembic]
script_location = alembic
prepend_sys_path = .

# Placeholder only -- app/env.py overrides this with the DATABASE_URL
# environment variable at runtime, so this value is never actually used
# when running inside Docker or against the home-lab environments.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/powergaming

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
