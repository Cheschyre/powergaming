# powergaming deploy stack -- shared by powergaming-test and
# powergaming-prod, which run as separate compose projects (separate
# containers, network and database volume) from separate directories on
# docker-host: /opt/powergaming-test and /opt/powergaming-prod.
#
# The deploy workflow (.github/workflows/deploy-stack.yml) uploads this
# file to the stack's directory as docker-compose.yml on every deploy,
# writes the image tag it just built into that directory's .env as TAG,
# then pulls and restarts -- edit it here, not on the VM. Everything that
# differs between test and prod (credentials, ports, APP_ENV) lives in
# each directory's .env; see .env.example and deploy/README.md.
#
# Unlike the root docker-compose.yml (local dev -- builds from source,
# bind-mounts the code, hot-reloads), this pulls pre-built images from
# GHCR that CI already built and pushed.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/cheschyre/powergaming-backend:${TAG:?TAG must be set in .env}
    restart: unless-stopped
    environment:
      - ENV=${APP_ENV:-test}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      # Direct access for /docs and debugging. The frontend doesn't use
      # this -- it talks to the api container over the compose network
      # via nginx's /api/ proxy (see frontend/nginx.conf).
      - "${API_PORT:-8001}:8000"

  web:
    image: ghcr.io/cheschyre/powergaming-frontend:${TAG:?TAG must be set in .env}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  pgdata:
