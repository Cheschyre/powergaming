server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container ("api" is the
    # service name in docker-compose.test.yml) so the frontend can use
    # relative paths regardless of what host/port this is served from.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Not a multi-page app yet, but this makes a future client-side
    # router (or a hard refresh on a deep link) fall back to index.html
    # instead of a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
