server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container ("api" is the
    # service name in deploy/docker-compose.yml) so the frontend can use
    # relative paths regardless of what host/port this is served from.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Not a multi-page app yet, but this makes a future client-side
    # router (or a hard refresh on a deep link) fall back to index.html
    # instead of a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current build's JS/CSS. Make browsers check for
    # a new one on every load, so a deploy shows up without a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every file name under /assets/, so a new
    # build always gets new URLs -- these can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
