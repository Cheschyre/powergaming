name: CI

# Runs on every push and every pull request, to any branch -- so once
# `develop` and feature branches exist, they all get the same checks main
# does. The backend job needs no external services since the test suite
# runs against an in-memory SQLite database (see backend/tests/conftest.py).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Run tests
        run: pytest -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Type-check and build
        run: npm run build

  api-types:
    name: API types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend

      # frontend/src/api-schema.ts is generated from backend/app/schemas.py;
      # if a model changed without regenerating, the committed copy is stale.
      - name: Regenerate and compare
        run: |
          scripts/gen-api-types.sh
          if ! git diff --exit-code -- frontend/openapi.json frontend/src/api-schema.ts; then
            echo "::error::frontend API types are stale -- run scripts/gen-api-types.sh and commit the result"
            exit 1
          fi
