name: Deploy stack

# Reusable: build+push backend/frontend images to GHCR, then SSH into the
# home-lab docker-host VM (over Tailscale) and redeploy one stack from
# them. Called by cd-test.yml (push to develop -> powergaming-test) and
# cd-prod.yml (version tag on main -> powergaming-prod).
#
# Uses the DEPLOY_SSH_KEY/DEPLOY_HOST/DEPLOY_USER and TS_OAUTH_* secrets
# (callers pass `secrets: inherit`) -- see deploy/README.md for the
# one-time setup this depends on.

on:
  workflow_call:
    inputs:
      stack:
        description: "Which stack to deploy: test or prod (-> /opt/powergaming-<stack>)"
        required: true
        type: string
      image_tag:
        description: "Tag to build, push and run, e.g. develop or v1.2.0"
        required: true
        type: string
      environment:
        description: "GitHub Environment the deploy job runs in"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: cheschyre

jobs:
  build-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/powergaming-backend:${{ inputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/powergaming-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          # Left empty so the built app uses relative "/api/..." calls,
          # proxied by nginx -- see frontend/Dockerfile and nginx.conf.
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/powergaming-frontend:${{ inputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/powergaming-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to powergaming-${{ inputs.stack }}
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Never run two deploys of the same stack at once; queue instead.
    concurrency:
      group: deploy-${{ inputs.stack }}
      cancel-in-progress: false
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The action exits 0 even when every `tailscale up` retry fails,
      # so check reachability ourselves -- fails here instead of as a
      # confusing SSH timeout. (Not the action's own `targets` check:
      # it fails whenever the path is DERP-relayed rather than direct,
      # which is normal for a home lab behind NAT.)
      - name: Check docker-host is reachable over the tailnet
        run: sudo tailscale ping --until-direct=false --c=10 "$DEPLOY_HOST"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Set up SSH (key + pinned docker-host host key)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # docker-host's sshd ED25519 key. Check with
          # `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` on the VM;
          # update here if the VM is ever rebuilt.
          HOST_KEY_FINGERPRINT: SHA256:q/lNhlNlifpMK9o/CWkHF9qk6FUvizdZI4PVydjcfbg
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" 2>/dev/null > host_key
          got=$(ssh-keygen -lf host_key | awk '{print $2}')
          if [ "$got" != "$HOST_KEY_FINGERPRINT" ]; then
            echo "::error::docker-host host key is $got, expected $HOST_KEY_FINGERPRINT"
            exit 1
          fi
          cat host_key >> ~/.ssh/known_hosts

      # Ships the compose file from this commit and records the image tag
      # in the stack's .env as TAG, so the VM's own `docker compose ...`
      # commands keep running exactly what was deployed. Both are
      # validated on the VM (against the real .env) before either live
      # file is replaced, so a bad deploy leaves the running stack alone.
      - name: Upload compose file, pull and restart the stack
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          STACK: ${{ inputs.stack }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          case "$STACK" in test|prod) ;; *) echo "::error::unknown stack '$STACK'"; exit 1;; esac
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::bad image tag '$IMAGE_TAG'"; exit 1
          fi
          STACK_DIR="/opt/powergaming-$STACK"
          scp -o BatchMode=yes deploy/docker-compose.yml \
            "$TARGET:$STACK_DIR/docker-compose.yml.new"
          ssh -o BatchMode=yes "$TARGET" bash -s -- "$STACK_DIR" "$IMAGE_TAG" <<'EOF'
          set -euo pipefail
          cd "$1"
          trap 'rm -f docker-compose.yml.new .env.new' EXIT
          if [ ! -f .env ]; then echo "no .env in $1 -- see deploy/README.md" >&2; exit 1; fi
          (umask 077; { grep -v '^TAG=' .env || true; echo "TAG=$2"; } > .env.new)
          docker compose --env-file .env.new -f docker-compose.yml.new config -q
          mv .env.new .env
          mv docker-compose.yml.new docker-compose.yml
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF
